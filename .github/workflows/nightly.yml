name: Nightly

# Nightly lane: the full SonarQube Cloud scan (C# across all TFMs, with OpenCover coverage).
# Fast build + unit tests + PR checks live in ci.yml. Modeled on tamp-observer's SonarCloud setup.
on:
  schedule:
    # 07:00 UTC daily.
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sonar:
    name: SonarCloud scan
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
      # Use the published Tamp.Core package, not the sibling-clone ProjectReference (which isn't
      # present in CI). Matches ci.yml; without it the build defaults to TampCoreMode=project and fails.
      TampCoreMode: package

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Full history so SonarCloud can attribute new code / blame.
          fetch-depth: 0

      - name: Set up JDK 21
        # The SonarScanner for .NET runs on the JVM (SonarQube Cloud recommends 21).
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up .NET SDKs
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: NuGet cache
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Install SonarScanner for .NET
        run: |
          dotnet tool install --global dotnet-sonarscanner --version 10.4.1
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      # Dogfood: tamp drives the scan. The Sonar target runs SonarBegin -> Compile -> Test
      # (all TFMs, OpenCover coverage via build/coverlet.runsettings) -> SonarEnd.
      - name: SonarCloud scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet run --project build -- Sonar
